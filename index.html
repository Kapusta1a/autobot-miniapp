margin-top: 12px;
            font-weight: 500;
        }
        
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Панель с логотипами слева -->
    <div class="sidebar">
        <div class="brand-logo" onclick="filterBrand('all')">Все</div>
        <div class="brand-logo" onclick="filterBrand('Toyota')">Toy</div>
        <div class="brand-logo" onclick="filterBrand('Kia')">Kia</div>
    </div>

    <!-- Основная часть с поиском и карточками -->
    <div class="main-content">
        <div class="header">
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск по названию..." onkeyup="searchCars()">
        </div>

        <div class="cards-container" id="cardsContainer">
            
            <!-- Карточка 1 -->
            <div class="card" data-brand="Toyota" data-title="Toyota Camry XV50">
                <div class="card-info">
                    <div class="card-title">Toyota Camry (XV50)</div>
                    <div><b>Годы:</b> 2011–2018</div>
                    <div><b>Двигатели:</b> 2.0, 2.5, 3.5</div>
                    <div class="pros">✔ Надежность, комфорт</div>
                    <div class="cons">✖ Шумоизоляция</div>
                    <button class="btn" onclick="buySubscription()">Узнать про болячки (150 ₽)</button>
                </div>
                <img src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?q=80&w=300&auto=format&fit=crop" class="car-image" alt="Camry">
            </div>

            <!-- Карточка 2 -->
            <div class="card" data-brand="Kia" data-title="Kia Rio IV">
                <div class="card-info">
                    <div class="card-title">Kia Rio (IV)</div>
                    <div><b>Годы:</b> 2017–2022</div>
                    <div><b>Двигатели:</b> 1.4, 1.6</div>
                    <div class="pros">✔ Дешевый в обслуживании</div>
                    <div class="cons">✖ Слабая шумоизоляция</div>
                    <button class="btn" onclick="buySubscription()">Узнать про болячки (150 ₽)</button>
                </div>
                <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=300&auto=format&fit=crop" class="car-image" alt="Rio">
            </div>

        </div>
    </div>

    <script>
        // Проверка: если мы в Телеграме - разворачиваем, если в браузере - просто работаем
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
        }

        function searchCars() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterBrand(brand) {
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const cardBrand = card.getAttribute('data-brand');
                if (brand === 'all' || cardBrand === brand) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('searchInput').value = '';
        }

        function buySubscription() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.showAlert("Здесь будет оплата 150 ₽");
            } else {
                alert("Здесь будет оплата 150 ₽ (Вы в браузере)");
            }
        }
    </script>
</body>
</html>
